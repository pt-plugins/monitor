name: Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: "uptime-pipeline"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Guard the shared "uptime-pipeline" concurrency group: a stuck step would
    # otherwise queue every following scheduled run behind it for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium --with-deps

      # Only IPv6 goes through WARP: GitHub runners have no native IPv6, so the
      # IPv6-only trackers still need the tunnel, while IPv4 keeps using the
      # runner's native egress (WARP egress gets 403 from cgpeers/passthepopcorn).
      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.4
        timeout-minutes: 6
        with:
          stack: ipv6
          mode: wireguard

      - name: Run uptime monitor
        run: pnpm monitor

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "monitor: [auto] uptime monitoring run"
          file_pattern: "data/"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
